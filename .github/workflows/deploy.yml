name: Deploy Metron

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # ECDSA host key of the Metron VPS (ssh-keygen -lf): appleboy (Go x/crypto/ssh) asks for ECDSA
  # before ed25519, so the ed25519 fingerprint never matched. Checked by every scp/ssh step.
  HOST_FINGERPRINT: SHA256:XxqjkdqXWRRzhehL2xB7u5OoQJSx7ZX4iR5X9+LYZDg

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: make test

      - name: Build Metron binary
        run: |
          mkdir -p build
          go build -o build/metron ./cmd/metron/main.go

      - name: Build Telegram Bot binary
        run: |
          go build -o build/metron-bot ./cmd/metron-bot/main.go

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18'

      - name: Install child UI dependencies
        working-directory: web/children-control
        run: npm ci

      - name: Build child UI
        working-directory: web/children-control
        env:
         VITE_API_BASE: ${{ secrets.CHILD_UI_API_BASE }}
        run: npm run build

      - name: Upload Metron binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metron-binary
          path: build/metron

      - name: Upload Bot binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metron-bot-binary
          path: build/metron-bot

      - name: Upload child UI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metron-child-ui
          path: web/children-control/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Download Metron binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: metron-binary
          path: .

      - name: Download Bot binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: metron-bot-binary
          path: .

      - name: Download child UI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: metron-child-ui
          path: child-ui-dist

      - name: Copy Metron binary to server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ env.HOST_FINGERPRINT }}
          source: "metron"
          target: "/opt/metron/metron_new"
          overwrite: true

      - name: Copy Bot binary to server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ env.HOST_FINGERPRINT }}
          source: "metron-bot"
          target: "/opt/metron-bot/metron-bot_new"
          overwrite: true

      - name: Upload Metron config from secret
        uses: appleboy/ssh-action@5f64c95280a8e7632da28096e00ccaecb296d200 # v0.1.9
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ env.HOST_FINGERPRINT }}
          script: |
            echo '${{ secrets.METRON_CONFIG_JSON }}' > /opt/metron/config.json
            chmod 600 /opt/metron/config.json

      - name: Upload Bot config from secret
        uses: appleboy/ssh-action@5f64c95280a8e7632da28096e00ccaecb296d200 # v0.1.9
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ env.HOST_FINGERPRINT }}
          script: |
            echo '${{ secrets.BOT_CONFIG_JSON }}' > /opt/metron-bot/bot-config.json
            chmod 600 /opt/metron-bot/bot-config.json

      - name: Activate new binaries
        uses: appleboy/ssh-action@5f64c95280a8e7632da28096e00ccaecb296d200 # v0.1.9
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ env.HOST_FINGERPRINT }}
          script: |
            # Activate Metron binary
            mv /opt/metron/metron_new/metron /opt/metron/metron
            sudo -n chmod +x /opt/metron/metron
            # Activate Bot binary
            mv /opt/metron-bot/metron-bot_new/metron-bot /opt/metron-bot/metron-bot
            sudo -n chmod +x /opt/metron-bot/metron-bot

      - name: Copy child UI to server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ env.HOST_FINGERPRINT }}
          source: "child-ui-dist"
          target: "/opt/metron-child"
          overwrite: true

      - name: Activate child UI
        uses: appleboy/ssh-action@5f64c95280a8e7632da28096e00ccaecb296d200 # v0.1.9
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ env.HOST_FINGERPRINT }}
          script: |
            rm -rf /opt/metron-child/dist
            mv /opt/metron-child/child-ui-dist /opt/metron-child/dist
            chown -R metron:metron /opt/metron-child/dist

      - name: Restart services
        uses: appleboy/ssh-action@5f64c95280a8e7632da28096e00ccaecb296d200 # v0.1.9
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ env.HOST_FINGERPRINT }}
          script: |
            sudo -n systemctl daemon-reload
            sudo -n systemctl restart metron
            sudo -n systemctl restart metron-bot
            systemctl is-active metron
            systemctl is-active metron-bot
